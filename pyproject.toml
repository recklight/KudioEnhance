[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kudio-enhance"
dynamic = ["version"]
description = "Train and run learned speech-enhancement (denoising) models on top of the kudio audio toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "RL" }]
keywords = [
    "speech-enhancement", "denoising", "audio", "deep-learning",
    "pytorch", "spectrogram",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # 3.7.1 is the first kudio whose eval_metrics takes pesq_scale, which
    # `evaluate --pesq-scale` passes straight through
    "kudio>=3.7.1",
    "numpy>=1.22",
    "PyYAML>=6.0",
    # 2.4.1 is the first torch whose wheels are built against NumPy 2 on
    # every platform. Older ones, and 2.4.0 on Windows, were built against
    # NumPy 1 and declare no numpy pin, so pip happily puts them beside the
    # NumPy 2 kudio allows, where torch.from_numpy fails with "Numpy is not
    # available"
    "torch>=2.4.1",
]

[project.optional-dependencies]
eval = ["kudio[eval]>=3.7.1"]
# 8.2 is the first pytest whose importorskip takes exc_type, which the suite
# uses to skip on a torch that is installed but cannot be imported
dev = ["kudio-enhance[eval]", "pytest>=8.2"]

[project.scripts]
kudio-enhance = "kudio_enhance.cli:main"

[project.urls]
Homepage = "https://github.com/recklight/KudioEnhance"
Issues = "https://github.com/recklight/KudioEnhance/issues"
Kudio = "https://pypi.org/project/kudio/"

[tool.setuptools.dynamic]
# read from _version.py, not the package __init__: setuptools parses this file
# statically, so building does not require the runtime dependencies
version = { attr = "kudio_enhance._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
