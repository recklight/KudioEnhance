name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    # the whole suite, models included, on a CPU-only PyTorch -- the CUDA
    # wheels PyPI serves by default are several gigabytes nobody here uses
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # PowerShell would judge a multi-line step by its last command only
        shell: bash
    env:
      # the Windows runner's console is cp1252; anything outside it in a
      # message would raise UnicodeEncodeError instead of printing
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Python, on the oldest torch pyproject allows -- the
          # floor is only true if something installs it. 22.04 because newer
          # runner images no longer carry a CPython 3.9
          - os: ubuntu-22.04
            python-version: "3.9"
            torch: "torch==2.4.1"
          - os: ubuntu-latest
            python-version: "3.11"
            torch: "torch"
          - os: ubuntu-latest
            python-version: "3.13"
            torch: "torch"
          - os: windows-latest
            python-version: "3.12"
            torch: "torch"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only PyTorch, then the package)
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  without-torch:
    # Config, features, manifests and the training curves are meant to work
    # with no framework installed, and the model tests to skip rather than
    # error. Only a job that never installs torch can show that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install everything except torch
        run: |
          python -m pip install --upgrade pip
          pip install "kudio[eval]>=3.7.1" numpy PyYAML pytest
          pip install -e . --no-deps
      - name: The package imports without torch
        run: python -c "import kudioenhance, sys; assert 'torch' not in sys.modules"
      - name: Run tests (framework tests skip)
        run: pytest -q

  publish:
    # build sdist+wheel and upload to PyPI when a v* tag is pushed
    needs: [test, without-torch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing (no API token in secrets)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches src/kudioenhance/_version.py
        # A mislabeled tag -- v1.1 cut from a tree that still says 1.0 -- is
        # caught here rather than on PyPI, which never lets a version number
        # be used twice. The version is read out of the file: nothing is
        # installed yet, so importing the package would fail for the wrong
        # reason.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(sed -n 's/^__version__ = "\([^"]*\)".*$/\1/p' src/kudioenhance/_version.py)
          if [ -z "$version" ]; then
            echo "found no __version__ = \"...\" line in src/kudioenhance/_version.py to check the tag against." >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match src/kudioenhance/_version.py, which says $version." >&2
            echo "Move the tag onto a commit whose _version.py says $tag, or bump _version.py and tag again." >&2
            exit 1
          fi
          echo "releasing $version"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check the built metadata
        run: twine check --strict dist/*
      - name: Import every module out of the built wheel
        # twine check imports nothing, so a module that fails on import goes
        # straight to PyPI without this. The walk runs outside the checkout,
        # so `import kudioenhance` can only find the wheel just installed, on
        # a CPU-only torch so the step does not download CUDA.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install dist/*.whl
          kudioenhance --version
          mkdir -p "$RUNNER_TEMP/import-walk"
          cd "$RUNNER_TEMP/import-walk"
          python - <<'PY'
          import importlib
          import pkgutil

          import kudioenhance

          broken = []
          for found in pkgutil.walk_packages(kudioenhance.__path__, "kudioenhance."):
              try:
                  importlib.import_module(found.name)
              except Exception as exc:
                  broken.append("{}: {}: {}".format(found.name, type(exc).__name__, exc))
          if broken:
              raise SystemExit("these modules do not import from the wheel:\n  "
                               + "\n  ".join(broken))
          print("every module under kudioenhance imports from the wheel")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
